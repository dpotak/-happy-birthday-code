
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css_Leon/index.css">
    <link rel="stylesheet" href="css_Leon/index_2.css">

    <title>Birthday Envelope</title>
</head>
<body>

    <div id="confetti"></div>

    <div class="flight">
        <div class="scene" id="scene">
            <div class="envelope">
                <div class="envelope-back"></div>

                <div class="letter">
                    <h2>❤️С Днём Рождения!❤️</h2>

                    <p>
                        Пусть каждый новый день приносит
                        радость, улыбки и приятные
                        моменты. 
                    </p>
                    <p>❤️С теплом и любовью!❤️</p>
                </div>

                <div class="envelope-front"></div>

                <div class="flap">
                    <div class="flap-front"></div>
                    <div class="flap-back"></div>
                </div>

                <div class="seal">♥</div>
            </div>
        </div>
    </div>

    <button id="toggle">Открыть конверт</button>

    <div class="hint">
        Нажми, чтобы открыть поздравление ❤️
    </div>

    <!-- Звуковые эффекты -->
    <audio id="paperSound" src="sounds/paper.mp3" preload="auto"></audio>
    <audio id="birthdayMusic" src="sounds/Backyard_Music_-_Sing_a_Birthday_Song.mp3" preload="auto" loop></audio>
    <audio id="closeSound" src="sounds/paper.mp3" preload="auto"></audio>

    <script src="index.js"></script>

</body>
</html>
